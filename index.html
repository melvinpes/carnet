<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F1FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#120A1C" media="(prefers-color-scheme: dark)">
<meta name="description" content="Suivi de budget familial : dépenses, budgets, comptes et prêts.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comptes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Carnet de Comptes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout : colonne téléphone (max 560px) posée sur un fond « mesh » animé ; carte holographique en tête, cartes en verre dépoli dessous, barre d'onglets flottante en bas, feuilles de saisie en verre qui montent du bas. Direction C « Holographique ». */
@property --hue{syntax:'<angle>';inherits:true;initial-value:0deg}
:root{
  /* Couleurs — sombre par défaut */
  --bg:#120A1C; --bg-2:#1A0F28;
  --ink:#FFF5FB; --muted:rgba(255,245,251,.66); --faint:rgba(255,245,251,.42);
  --glass:rgba(255,255,255,.065); --glass-2:rgba(255,255,255,.11); --glass-press:rgba(255,255,255,.16);
  --stroke:rgba(255,255,255,.13); --hi:rgba(255,255,255,.16); --line:rgba(255,255,255,.10);
  --rose:#FF7AC6; --mint:#7AF0D0; --lilac:#A98BFF; --peach:#FFB37A; --gold:#E9D9A6;
  --good:#7AF0D0; --warn:#FFC27A; --bad:#FF8A9B;
  --holo-ink:#1B0B26; --holo-muted:rgba(27,11,38,.64);
  --holo-1:#FFD1EC; --holo-2:#C9F7EA; --holo-3:#D9CCFF; --holo-4:#FFE8C2;
  --mesh-1:#FF4FAE; --mesh-2:#3DE0B8; --mesh-3:#7C5CFF; --mesh-a:.30;
  --cta-1:#FF7AC6; --cta-2:#A98BFF; --cta-ink:#1B0B26;
  /* Alias lus par les graphiques */
  --accent:var(--mint); --accent-soft:rgba(122,240,208,.16); --chart-dep:var(--peach); --seg-fix:var(--lilac); --seg-inv:var(--rose); --seg-loan:#6FB8FF;
  --surface:var(--glass); --surface-2:var(--glass-2);
  /* Typo */
  --f-display:"Unbounded", "Inter", ui-sans-serif, system-ui, sans-serif;
  --f-ui:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --t-xs:12px; --t-sm:13.5px; --t-md:16px; --t-lg:19px; --t-xl:26px; --t-hero:clamp(30px, 9.5vw, 42px);
  /* Rayons, espacements */
  --r-sm:12px; --r-md:18px; --r-lg:24px; --r-xl:28px; --r-pill:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:28px;
  /* Ombres et halos */
  --sh-card:0 10px 30px -18px rgba(0,0,0,.6);
  --sh-holo:0 24px 50px -18px rgba(255,122,198,.55), 0 8px 24px -12px rgba(169,139,255,.45);
  --glow-rose:0 0 0 1px rgba(255,122,198,.35), 0 8px 28px -6px rgba(255,122,198,.55);
  --glow-mint:0 0 22px -2px rgba(122,240,208,.55);
  --blur:blur(20px) saturate(150%);
  /* Mouvement */
  --d-1:140ms; --d-2:240ms; --d-3:420ms; --d-4:900ms; --d-ambient:14s;
  --e-out:cubic-bezier(.22,1,.36,1); --e-spring:cubic-bezier(.34,1.56,.64,1); --e-inout:cubic-bezier(.65,0,.35,1);
  --stagger:45ms;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F7F1FB; --bg-2:#FFFFFF;
  --ink:#1E0F2B; --muted:rgba(30,15,43,.66); --faint:rgba(30,15,43,.45);
  --glass:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.82); --glass-press:rgba(255,255,255,.95);
  --stroke:rgba(60,20,90,.10); --hi:rgba(255,255,255,.9); --line:rgba(60,20,90,.10);
  --rose:#C82C82; --mint:#0C8F72; --lilac:#6A47DB; --peach:#C76A1C;
  --good:#0C8F72; --warn:#A35C00; --bad:#C8324A;
  --mesh-1:#FF9FD4; --mesh-2:#8FF3D8; --mesh-3:#B9A6FF; --mesh-a:.42;
  --cta-1:#E2489E; --cta-2:#7C5CFF; --cta-ink:#FFFFFF;
  --accent-soft:rgba(12,143,114,.12); --seg-loan:#2B6FD6;
  --sh-card:0 10px 30px -18px rgba(80,30,110,.35);
  --sh-holo:0 22px 44px -18px rgba(200,44,130,.40), 0 8px 22px -12px rgba(106,71,219,.30);
  --glow-rose:0 0 0 1px rgba(200,44,130,.25), 0 8px 24px -8px rgba(200,44,130,.45);
  --glow-mint:0 0 18px -4px rgba(12,143,114,.45);
  color-scheme:light } }
:root[data-theme="light"]{
  --bg:#F7F1FB; --bg-2:#FFFFFF;
  --ink:#1E0F2B; --muted:rgba(30,15,43,.66); --faint:rgba(30,15,43,.45);
  --glass:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.82); --glass-press:rgba(255,255,255,.95);
  --stroke:rgba(60,20,90,.10); --hi:rgba(255,255,255,.9); --line:rgba(60,20,90,.10);
  --rose:#C82C82; --mint:#0C8F72; --lilac:#6A47DB; --peach:#C76A1C;
  --good:#0C8F72; --warn:#A35C00; --bad:#C8324A;
  --mesh-1:#FF9FD4; --mesh-2:#8FF3D8; --mesh-3:#B9A6FF; --mesh-a:.42;
  --cta-1:#E2489E; --cta-2:#7C5CFF; --cta-ink:#FFFFFF;
  --accent-soft:rgba(12,143,114,.12); --seg-loan:#2B6FD6;
  --sh-card:0 10px 30px -18px rgba(80,30,110,.35);
  --sh-holo:0 22px 44px -18px rgba(200,44,130,.40), 0 8px 22px -12px rgba(106,71,219,.30);
  --glow-rose:0 0 0 1px rgba(200,44,130,.25), 0 8px 24px -8px rgba(200,44,130,.45);
  --glow-mint:0 0 18px -4px rgba(12,143,114,.45);
  color-scheme:light }
@media (prefers-reduced-motion: reduce){ :root{ --d-1:1ms; --d-2:1ms; --d-3:1ms; --d-4:1ms; --stagger:0ms } }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:var(--t-md);line-height:1.45;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:10px}
.wrap{max-width:560px;margin:0 auto;padding-inline:var(--s-4)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:var(--t-sm)}
.pos{color:var(--good)} .neg{color:var(--bad)} .state-warn{color:var(--warn)}

/* Fond mesh */
#mesh{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;filter:blur(30px);opacity:var(--mesh-a);transform:scale(1.15)}
/* Animations légères : pas de flou d'arrière-plan, fond fixe, carte immobile */
.lite #mesh{filter:none;image-rendering:auto}
.lite .card,.lite .list,.lite .stat,.lite .banner,.lite .tile,.lite .icon-btn,.lite .tabs .wrap,.lite .sheet,.lite .toast,.lite .scrub-bubble,.lite .tour-bub,.lite .top,.lite .field input,.lite .field select{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.lite .card,.lite .list,.lite .stat,.lite .banner,.lite .tile{background:var(--row-bg)}
.lite .tabs .wrap,.lite .sheet,.lite .tour-bub,.lite .toast{background:var(--row-bg)}
.lite .top{background:var(--bg)}
.lite .holo,.lite .hero,.lite .brand-mark,.lite .sp-card{animation:none!important}
.lite .tour-hole{animation:none}

/* Splash */
#splash{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;transition:opacity var(--d-3) var(--e-out), visibility 0s linear var(--d-3)}
#splash.out{opacity:0;visibility:hidden}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:var(--s-4)}
.sp-card{width:120px;aspect-ratio:1.586;border-radius:18px;background:conic-gradient(from var(--hue) at 70% 30%,var(--holo-1),var(--holo-2),var(--holo-3),var(--holo-4),var(--holo-1));box-shadow:var(--sh-holo);display:grid;place-items:center;color:var(--holo-ink);font:700 30px var(--f-display);animation:sp-card 900ms var(--e-spring) both, hue 3s linear infinite}
.sp-name{font:600 15px var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);animation:sp-name 700ms 250ms var(--e-out) both}
@keyframes sp-card{from{transform:perspective(600px) rotateY(-70deg) rotateX(20deg) scale(.6);opacity:0}}
@keyframes sp-name{from{transform:translateY(8px);opacity:0;letter-spacing:.5em}}
@keyframes hue{to{--hue:360deg}}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;view-transition-name:topbar;background:color-mix(in srgb,var(--bg) 62%,transparent);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);-webkit-mask:linear-gradient(#000 78%,transparent);mask:linear-gradient(#000 78%,transparent)}
.top .wrap{padding-bottom:var(--s-4)!important}
.top .wrap{padding-block:var(--s-3) var(--s-2)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font:600 var(--t-lg) var(--f-display);letter-spacing:-.01em}
.brand span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-mark{width:34px;height:22px;border-radius:6px;flex:none;display:grid;place-items:center;font:700 12px var(--f-display);color:var(--holo-ink);background:conic-gradient(from var(--hue) at 70% 30%,var(--holo-1),var(--holo-2),var(--holo-3),var(--holo-4),var(--holo-1));box-shadow:0 4px 14px -4px rgba(255,122,198,.6)}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:transform var(--d-1) var(--e-out)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{padding-bottom:120px}
.view{display:flex;flex-direction:column;gap:var(--s-5);padding-top:var(--s-2)}
.eyebrow{font-size:var(--t-xs);font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0}
.sec{display:flex;flex-direction:column;gap:var(--s-3)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-3)}
.link{color:var(--rose);font-weight:600;font-size:14px}
.help{font-size:var(--t-sm);color:var(--muted);margin:0;line-height:1.5}

/* Verre */
.card,.list,.stat,.banner{background:var(--glass);border:1px solid var(--stroke);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:inset 0 1px 0 var(--hi), var(--sh-card)}
.card{border-radius:var(--r-lg);padding:var(--s-4)}
.list{border-radius:var(--r-lg);overflow:hidden}
.list > * + *{border-top:1px solid var(--line)}
.banner{border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:10px;font-size:14px;border-color:rgba(255,122,198,.35)}
.banner .btn{align-self:flex-start}

/* Carte holographique */
.holo-wrap{perspective:1000px}
.holo{position:relative;aspect-ratio:1.586;max-height:260px;width:100%;border-radius:var(--r-xl);padding:20px 22px;color:var(--holo-ink);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;isolation:isolate;
  background:conic-gradient(from calc(200deg + var(--hue)) at var(--mx,70%) var(--my,30%),var(--holo-1),var(--holo-2),var(--holo-3),var(--holo-4),var(--holo-1));
  box-shadow:var(--sh-holo), inset 0 1px 0 rgba(255,255,255,.75);transform-style:preserve-3d;will-change:transform;touch-action:pan-y;
  animation:hue var(--d-ambient) linear infinite}
.holo.neg-card{--holo-1:#FFC9D2; --holo-2:#FFE3B8; --holo-3:#F9C6E8; --holo-4:#FFD7C2}
.holo-shine{position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(55% 45% at var(--mx,30%) var(--my,20%),rgba(255,255,255,.7),transparent 65%),
             repeating-linear-gradient(115deg,rgba(255,255,255,0) 0 9px,rgba(255,255,255,.12) 9px 10px);mix-blend-mode:soft-light}
.holo-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.holo-lbl{font-size:var(--t-xs);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--holo-muted);max-width:22ch}
.holo-chip{width:38px;height:28px;border-radius:7px;flex:none;background:linear-gradient(135deg,#F1E4B6,#BFA35F);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);position:relative}
.holo-chip::before{content:"";position:absolute;inset:6px 8px;border:1px solid rgba(0,0,0,.18);border-radius:3px}
.holo-num{font:700 var(--t-hero)/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.holo-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-size:var(--t-sm);color:var(--holo-muted)}
.holo-foot b{color:var(--holo-ink);white-space:nowrap}
.holo-foot > span:first-child{text-wrap:balance}
.holo-tag{font-weight:700;color:var(--holo-ink);background:rgba(255,255,255,.45);padding:4px 10px;border-radius:var(--r-pill);white-space:nowrap}

/* Héros générique (autres écrans) */
.hero{border-radius:var(--r-xl);padding:20px;display:flex;flex-direction:column;gap:12px;color:var(--holo-ink);
  background:conic-gradient(from calc(200deg + var(--hue)) at 70% 30%,var(--holo-1),var(--holo-2),var(--holo-3),var(--holo-4),var(--holo-1));box-shadow:var(--sh-holo);animation:hue var(--d-ambient) linear infinite}
.hero .eyebrow{color:var(--holo-muted)}
.hero-num{font:700 var(--t-hero)/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero-cap{font-size:var(--t-sm);color:var(--holo-muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;font-size:13px;font-weight:700;padding:5px 11px;border-radius:var(--r-pill);background:rgba(255,255,255,.45);color:var(--holo-ink);align-self:flex-start}
#holo-wealth{view-transition-name:wealth}
.holo-split{font-size:12.5px;line-height:1.5}
.holo-foot{flex-wrap:wrap}

/* Tuiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
.tile{border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:inset 0 1px 0 var(--hi)}
.tile span{font-size:var(--t-xs);color:var(--muted)}
.tile b{font:600 17px var(--f-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.go{position:relative}
.tile.go::after{content:"→";position:absolute;right:12px;top:12px;color:var(--faint);font-size:14px}
#tile-wealth{view-transition-name:wealth}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-2)}
.stat{border-radius:var(--r-md);padding:12px;min-width:0;display:flex;flex-direction:column;gap:4px}
.stat span{font-size:var(--t-xs);color:var(--muted)}
.stat b{display:block;font:600 clamp(13px,3.7vw,16px) var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Donut */
.donut-card{display:grid;grid-template-columns:132px 1fr;gap:var(--s-4);align-items:center}
.donut{width:132px;height:132px;display:block}
.donut .seg{fill:none;stroke-width:14;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;stroke-dasharray:var(--len) var(--c);stroke-dashoffset:var(--off)}
.donut .track{fill:none;stroke:var(--line);stroke-width:14}
.donut text{font-family:var(--f-display)}
.legend-rows{display:flex;flex-direction:column;gap:10px;min-width:0}
.legend-rows div{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.legend-rows span{font-size:var(--t-sm);min-width:0}
.legend-rows span i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
.legend-rows b{font:600 14px var(--f-display);font-variant-numeric:tabular-nums}
.legend-rows .muted{grid-column:1/-1;font-size:var(--t-xs);padding-left:16px}
.stack{display:flex;height:12px;border-radius:7px;overflow:hidden;gap:3px}
.stack i{display:block;min-width:4px;border-radius:4px}

/* Jauge objectif */
.gauge{position:relative;height:12px;border-radius:8px;background:var(--line);overflow:visible}
.gauge > i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:linear-gradient(90deg,var(--lilac),var(--mint));width:var(--w)}
.gauge.ok > i{box-shadow:var(--glow-mint)}
.gauge.ko > i{background:linear-gradient(90deg,var(--lilac),var(--peach))}
.gauge .mark{position:absolute;top:-5px;bottom:-5px;width:2px;border-radius:2px;background:var(--ink);opacity:.8}
.gauge-cap{display:flex;justify-content:space-between;font-size:var(--t-xs);color:var(--muted)}
.big-mid{font:700 var(--t-xl) var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chip-state{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:var(--r-pill);white-space:nowrap;border:1px solid transparent}
.chip-state.ok{background:var(--accent-soft);color:var(--good);border-color:rgba(122,240,208,.35)}
.chip-state.ko{background:rgba(255,194,122,.14);color:var(--warn);border-color:rgba(255,194,122,.35)}

/* Lignes de liste */
.acc-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;width:100%;text-align:left;transition:background var(--d-1)}
.acc-row:active{background:var(--glass-press)}
.acc-row .r{text-align:right;font-variant-numeric:tabular-nums}
.acc-row .r b{display:block;font:600 17px var(--f-display);letter-spacing:-.01em}
.total{display:flex;flex-direction:column;gap:4px}
.total .big{font:700 34px var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv span{font-size:var(--t-xs);color:var(--muted)}
.kv b{font:600 15px var(--f-display);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:5px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--r-md);font-weight:700;background:var(--glass-2);border:1px solid var(--stroke);color:var(--ink);transition:transform var(--d-1) var(--e-out), box-shadow var(--d-2) var(--e-out)}
.btn:active,.tile:active,.acc-row:active,.chip:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(120deg,var(--cta-1),var(--cta-2));color:var(--cta-ink);border-color:transparent;box-shadow:var(--glow-rose)}
.btn.primary:active{box-shadow:0 0 0 1px rgba(255,122,198,.5),0 0 36px -2px rgba(255,122,198,.75)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.small{min-height:38px;padding:0 15px;font-size:14px;border-radius:12px}
.btn-add{border:1.5px dashed var(--stroke);background:transparent;color:var(--rose);backdrop-filter:none}

/* Onglets */

  /* Count-up : <b data-count="258.51" data-key="poss">258,51 €</b> */

    put(from); requestAnimationFrame(step);

  /* Après chaque rendu d'écran */

  /* Inclinaison 3D + reflets (doigt, souris ou gyroscope) */

    var el=null, tgt={x:0,y:0}, cur={x:0,y:0}, raf=0, gyro=false, asked=false;

        el.style.setProperty('--mx',((cur.x+.5)*100).toFixed(1)+'%'); el.style.setProperty('--my',((cur.y+.5)*100).toFixed(1)+'%');
      }

  /* Lignes glissables (modifier / supprimer) avec retour élastique */

  /* Graphiques : valeur qui suit le doigt */

  /* Feuille de saisie : glisser vers le bas pour fermer, champs en cascade */

    area.addEventListener('touchstart',function(e){

      if(!on) return; var mx=e.touches[0].clientX-x0, my=e.touches[0].clientY-y0;

    area.addEventListener('touchend',end,{passive:true}); area.addEventListener('touchcancel',end,{passive:true});
  }

    sh.addEventListener('pointermove',function(e){ if(id!==e.pointerId) return; dy=Math.max(0,e.clientY-y0); sh.style.transform='translateY('+dy+'px)'; });
    var end=function(e){ if(id!==e.pointerId) return; id=null; sh.style.transition=''; sh.style.transform=''; if(dy>110) close(); };
    sh.addEventListener('pointerup',end); sh.addEventListener('pointercancel',end);
  }

  /* Fond mesh : canvas minuscule (60×100) agrandi et flouté, ~30 fps, en pause hors écran */
  var meshRestart=function(){};
  function mesh(){
    var c=document.getElementById('mesh'); if(!c||!c.getContext) return;
    var g=c.getContext('2d'), W=60, H=100; c.width=W; c.height=H;
    var blobs=[{v:'--mesh-1',x:.2,y:.2,r:.65,sx:.07,sy:.05,p:0},{v:'--mesh-2',x:.85,y:.35,r:.6,sx:.05,sy:.08,p:2},{v:'--mesh-3',x:.5,y:.85,r:.7,sx:.06,sy:.04,p:4},{v:'--mesh-1',x:.9,y:.9,r:.45,sx:.04,sy:.06,p:1}];
    var cols=[], last=0, t0=performance.now(), raf=0;

    function draw(now){
      var t=(now-t0)/1000; g.clearRect(0,0,W,H);

        var x=(b.x+Math.sin(t*b.sx*2+b.p)*.18)*W, y=(b.y+Math.cos(t*b.sy*2+b.p)*.14)*H, r=b.r*W*1.4;

    meshRestart=function(){ stop(); start(); };
    start();
  }

    var hide=function(){ s.classList.add('out'); setTimeout(function(){ s.remove(); },600); };

  }

      P.push({x:W/2+(Math.random()-.5)*80,y:H*.42,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,w:5+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]}); }

/* ---------- Données ---------- */
var BASE='2000-01', SECS=['incomes','fixed','living'];
var ATYPES={
  courant:{t:'Comptes courants',one:'Compte courant',c:'var(--seg-fix)'},

function mKey(y,m){ var d=new Date(y,m,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function monthLabel(y,m){ var d=new Date(y,m,1); return cap(MONTHS[d.getMonth()])+' '+d.getFullYear(); }

function line(n,a){ return {id:uid(),name:n,amount:a}; }

    living:[line('Courses',0),line('Essence',0),line('Loisirs',0)]}],extras:[],checkins:[],
    accounts:[account('Compte courant','courant'),account('Livret A','epargne')],loans:[]};
}
function exampleSimple(){
  var s={plans:[{from:BASE,incomes:[line('Salaire',1680)],
    fixed:[line('Loyer',620),line('Électricité',65),line('Internet & mobile',45),line('Assurance auto',48),line('Streaming',13.49)],
    living:[line('Courses',260),line('Essence',160),line('Loisirs',150),line('Divers',60)]}],
    extras:[{id:uid(),month:mKey(today.getFullYear(),today.getMonth()+1),name:'Révision de la voiture',amount:180}],checkins:[],loans:[],
    accounts:[account('Compte courant','courant'),account('Livret A','epargne'),account('LEP','epargne'),account('PEA','placement')]};

    s.checkins.push({month:k,date:d,snap:true,balance:bal[i],saved:0,target:258.51});

function emptyData(){ return {v:3,example:false,settings:{name:'',margin:10,started:curKey(),tour:null},simple:defaultSimple()}; }
function exampleData(){ return {v:3,example:true,settings:{name:'',margin:10},simple:exampleSimple()}; }
function valid(d){ return !!(d && d.simple && typeof d.simple==='object'); }
function normalize(d){
  var sm=d.simple, arr=function(x){return Array.isArray(x)?x:[]};
  var out={v:3,example:!!d.example,settings:{name:(d.settings&&d.settings.name)||'',margin:d.settings&&d.settings.margin!=null?d.settings.margin:10,started:(d.settings&&typeof d.settings.started==='string')?d.settings.started:null,tour:(d.settings&&typeof d.settings.tour==='number')?d.settings.tour:null,remind:!(d.settings&&d.settings.remind===false),lastBackup:(d.settings&&typeof d.settings.lastBackup==='string')?d.settings.lastBackup:null,snooze:(d.settings&&typeof d.settings.snooze==='string')?d.settings.snooze:null},
    simple:{plans:[],extras:arr(sm.extras).filter(function(e){return e&&/^\d{4}-\d{2}$/.test(e.month)}),checkins:arr(sm.checkins),accounts:arr(sm.accounts)}};
  var ids=function(a){ return arr(a).filter(function(x){return x&&typeof x==='object'}).map(function(x){ return {id:x.id||uid(),name:x.name||'',amount:+x.amount||0}; }); };

  if(!plans.length){
    var inc=ids(sm.incomes),fix=ids(sm.fixed),liv=ids(sm.living);
    if(!inc.length&&!fix.length&&!liv.length&&!out.simple.checkins.length){ var df=defaultSimple().plans[0]; inc=df.incomes; fix=df.fixed; liv=df.living; }
    plans=[{from:BASE,incomes:inc,fixed:fix,living:liv}];
  }
  plans.sort(byFrom); if(plans[0].from>BASE) plans[0].from=BASE;
  out.simple.plans=plans;
  out.simple.extras.forEach(function(e){ e.id=e.id||uid(); e.amount=+e.amount||0; });
  out.simple.loans=arr(sm.loans).filter(function(l){ return l&&Array.isArray(l.steps)&&l.steps.length&&/^\d{4}-\d{2}$/.test(l.first||''); }).map(function(l){
    return {id:l.id||uid(),name:l.name||'Crédit',first:l.first,rate:l.rate==null?null:+l.rate,rem:l.rem==null?null:+l.rem,remK:l.remK||null,celebrated:!!l.celebrated,
      steps:l.steps.filter(function(x){return x&&/^\d{4}-\d{2}$/.test(x.until)}).map(function(x){return {amount:+x.amount||0,until:x.until}})};
  }).filter(function(l){return l.steps.length});
  if(!out.simple.accounts.length){
    var a=account('Compte courant','courant'), cs=out.simple.checkins.slice().sort(function(x,y){return x.month<y.month?-1:1});
    cs.forEach(function(c){ a.history.push({date:monthEnd(c.month),balance:c.balance}); });

}

/* ---------- Budgets par mois ----------
   Le budget est une suite de versions datées : chaque version vaut à partir de son mois
   et jusqu'à la suivante. Modifier le budget d'un mois crée (si besoin) une version pour ce mois
   et applique le changement à ce mois et aux suivants ; les mois d'avant gardent leur version. */
function curKey(){ return mKey(today.getFullYear(),today.getMonth()); }
function shiftKey(k,n){ var p=k.split('-').map(Number); return mKey(p[0],p[1]-1+n); }
function mName(k){ return MONTHS[+k.split('-')[1]-1]; }
function de(w){ return /^[aeiouyhéèêâàô]/i.test(w)?'d’'+w:'de '+w; }
function byFrom(a,b){ return a.from<b.from?-1:a.from>b.from?1:0; }
function planFor(k){ var ps=S.simple.plans, best=ps[0]; for(var i=0;i<ps.length;i++) if(ps[i].from<=k) best=ps[i]; return best; }
function cloneItems(a){ return a.map(function(x){ return {id:x.id,name:x.name,amount:x.amount}; }); }
function ensurePlan(k){ var c=planFor(k); if(c.from===k) return; var n={from:k}; SECS.forEach(function(s){ n[s]=cloneItems(c[s]); }); S.simple.plans.push(n); S.simple.plans.sort(byFrom); }
function planSig(p){ return JSON.stringify(SECS.map(function(s){ return p[s].map(function(x){ return [x.id,x.name,+x.amount||0]; }); })); }
function tidyPlans(){ var ps=S.simple.plans; for(var i=ps.length-1;i>0;i--) if(planSig(ps[i])===planSig(ps[i-1])) ps.splice(i,1); }
function planEdit(k,fn){ ensurePlan(k); S.simple.plans.forEach(function(p){ if(p.from>=k) fn(p); }); tidyPlans(); }
function monthExtras(k){ return S.simple.extras.filter(function(e){ return e.month===k; }); }
function wealthAt(ds){ return sum(S.simple.accounts,function(a){ var b=balAt(a,ds); return b||0; }); }

/* ---------- Crédits ----------
   Un crédit = des paliers de mensualités ({amount, until}) à partir de sa première échéance.
   Les mensualités s'ajoutent toutes seules aux dépenses obligatoires du budget, mois par mois.
   Capital restant dû : à partir du montant saisi (et du taux s'il est connu), sinon estimé. */
function monthsDiff(a,b){ var x=a.split('-').map(Number), y=b.split('-').map(Number); return (y[0]-x[0])*12+(y[1]-x[1]); }
function loanEnd(l){ return l.steps.length?l.steps[l.steps.length-1].until:l.first; }
function loanPay(l,k){
  if(k<l.first||k>loanEnd(l)) return 0;
  for(var i=0;i<l.steps.length;i++) if(k<=l.steps[i].until) return +l.steps[i].amount||0;
  return 0;
}
function loansPay(k){ return sum(S.simple.loans,function(l){ return loanPay(l,k); }); }
function loanDue(l,k){
  var end=loanEnd(l); if(k>=end) return 0;
  var i=(+l.rate||0)/1200, m, R;
  if(l.rem!=null&&l.remK){
    R=+l.rem; m=l.remK;
    if(k>=m){ while(m<k){ m=shiftKey(m,1); R=R*(1+i)-loanPay(l,m); } }
    else { while(m>k){ R=(R+loanPay(l,m))/(1+i); m=shiftKey(m,-1); } }
    return Math.max(0,r2(R));
  }
  R=0; m=shiftKey(k,1); var n=1;
  while(m<=end){ R+=loanPay(l,m)/Math.pow(1+i,n); m=shiftKey(m,1); n++; }
  return Math.max(0,r2(R));
}
function loanLeft(l){ return Math.max(0,monthsDiff(curKey(),loanEnd(l))+1); }
function loanPaidTotal(l){ var t=0,m=curKey(),e=loanEnd(l); while(m<=e){ t+=loanPay(l,m); m=shiftKey(m,1); } return t; }
function debtAt(k){ return sum(S.simple.loans,function(l){ return k<l.first?0:loanDue(l,k); }); }
function debtNow(){ return debtAt(curKey()); }
function activeLoans(k){ k=k||curKey(); return S.simple.loans.filter(function(l){ return loanPay(l,k)>0; }); }
function loanKnown(l){ return l.rem!=null||(+l.rate>0); }
function endLabel(k){ return cap(mName(k))+' '+k.slice(0,4); }

function renderLoans(){
  var ls=S.simple.loans, tot=debtNow(), h='<div id="loan-zone" class="zone"><div class="sec"><div class="sec-head"><p class="eyebrow">Crédits</p>'+(ls.length?'<span class="small num neg"><b>−'+fmt(tot)+'</b></span>':'')+'</div>';
  if(ls.length){
    h+='<div class="list" data-stagger>'+ls.map(function(l){
      var end=loanEnd(l), left=loanLeft(l), due=loanDue(l,curKey()), span=Math.max(1,monthsDiff(l.first,end)+1), done=Math.min(1,Math.max(0,(monthsDiff(l.first,curKey())+1)/span));
      var pay=loanPay(l,curKey())||(l.steps[0]&&l.steps[0].amount)||0, fin=left<=0;
      return swipeRow('loan',l.id,'<button class="acc-row sw-front loan-row" data-loan="'+l.id+'"><span class="loan-main"><span class="loan-line1"><b>'+esc(l.name)+'</b><b class="num '+(fin||due<0.5?'pos':'neg')+'">'+(fin?'Remboursé':due<0.5?'Dernier mois':'−'+fmt(due))+'</b></span>'
        +'<span class="small muted">'+(fin?'Fini en '+endLabel(end).toLowerCase():fmt(pay)+' / mois · fin '+endLabel(end).toLowerCase()+' · '+left+' mensualité'+(left>1?'s':''))+(l.steps.length>1&&!fin?' · à paliers':'')+'</span>'
        +'<span class="bar loan-bar"><i style="width:'+(done*100).toFixed(1)+'%;background:linear-gradient(90deg,var(--lilac),var(--mint))"></i></span></span></button>');
    }).join('')+'</div>';
    var est=ls.some(function(l){return !loanKnown(l)&&loanLeft(l)>0});
    if(est) h+='<p class="help">Sans capital restant ni taux, l’app compte ce qu’il reste à payer (intérêts compris). Indique le capital restant dû pour un chiffre exact.</p>';
  } else {

  }
  h+='</div><button class="btn btn-add block" data-addloan="1">+ Ajouter un crédit</button></div>';

}

function wealthChart(rows){

  var P=rows.map(function(x,i){return [X(i),Y(x.v)]}), d='M'+P[0][0].toFixed(1)+' '+P[0][1].toFixed(1);
  for(var i=0;i<n-1;i++){ var p0=P[i-1]||P[i], p1=P[i], p2=P[i+1], p3=P[i+2]||p2;
    d+=' C'+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+' '+(p1[1]+(p2[1]-p0[1])/6).toFixed(1)+' '+(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+' '+(p2[1]-(p3[1]-p1[1])/6).toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1); }
  var area=d+' L'+P[n-1][0].toFixed(1)+' '+(T+plotH)+' L'+P[0][0].toFixed(1)+' '+(T+plotH)+' Z';
  var s='<defs><linearGradient id="wgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--mint);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--mint);stop-opacity:0"/></linearGradient>'
    +'<linearGradient id="wline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--lilac)"/><stop offset="1" style="stop-color:var(--mint)"/></linearGradient></defs>';
  s+='<line x1="0" x2="'+W+'" y1="'+(T+plotH)+'" y2="'+(T+plotH)+'" style="stroke:var(--line)"/>';
  s+='<path class="fade" d="'+area+'" fill="url(#wgrad)"/>';

function histChart(rows){
  var W=330,H=170,T=18,B=24,plotH=H-T-B,n=rows.length,gw=W/n,bw=Math.min(28,gw*.55);
  var hiV=Math.max.apply(null,rows.map(function(x){return Math.max(x.r,x.t,0)})), loV=Math.min.apply(null,rows.map(function(x){return Math.min(x.r,0)}));
  var hi=niceMax(hiV), lo=loV<0?-niceMax(-loV):0, y=function(v){return T+(hi-v)/(hi-lo)*plotH}, s='', pts=[];
  s+='<defs><linearGradient id="hgood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--mint)"/><stop offset="1" style="stop-color:var(--lilac)"/></linearGradient></defs>';
  s+='<line x1="0" x2="'+W+'" y1="'+y(hi)+'" y2="'+y(hi)+'" style="stroke:var(--line)" stroke-dasharray="3 4"/>';
  s+='<line x1="0" x2="'+W+'" y1="'+y(0)+'" y2="'+y(0)+'" style="stroke:var(--muted)"/>';
  s+='<text x="'+W+'" y="'+(T-6)+'" text-anchor="end" font-size="11" style="fill:var(--muted)">'+esc(eur.format(hi).replace(/,00/,''))+'</text>';
  if(lo<0) s+='<text x="'+W+'" y="'+(H-B+14)+'" text-anchor="end" font-size="11" style="fill:var(--muted)">'+esc(eur.format(lo).replace(/,00/,''))+'</text>';
  rows.forEach(function(x,i){
    var cx=i*gw+gw/2, top=y(Math.max(x.r,0)), bot=y(Math.min(x.r,0)), ok=x.r>=x.t;
    s+='<rect class="grow" x="'+(cx-bw/2)+'" y="'+top+'" width="'+bw+'" height="'+Math.max(1,bot-top)+'" rx="5" style="--k:'+i+';fill:'+(ok?'url(#hgood)':'var(--chart-dep)')+'"><title>'+keyLabel(x.c.month)+' : '+fmt(x.r)+' (objectif '+fmt(x.t)+')</title></rect>';
    s+='<line class="fade" x1="'+(cx-bw/2-4)+'" x2="'+(cx+bw/2+4)+'" y1="'+y(x.t)+'" y2="'+y(x.t)+'" stroke-width="2.5" stroke-linecap="round" style="stroke:var(--ink)"/>';
    var p=x.c.month.split('-').map(Number);
    s+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle" font-size="12" style="fill:var(--muted)">'+MSHORT[p[1]-1]+'</text>';
    pts.push({x:+cx.toFixed(1),y:+top.toFixed(1),l:keyLabel(x.c.month),v:fmt(x.r)+' · objectif '+fmt(x.t)});

/* ---------- Bilan = soldes des comptes ----------
   Une seule source de vérité : les soldes des comptes. Le bilan d'un mois enregistre le solde
   de chaque compte à la fin du mois ; l'épargne réelle est la variation du total entre deux bilans. */
function dateFor(k){ var e=monthEnd(k), t=iso(today); return e<t?e:t; }

  var v1=balAt(a,d1); if(v1===null) return 0;

  return v1-v0;

  var p=ciFind(prevKey(c.month)); if(!p) return null;
  if(c.snap){ var d0=ciDate(p), d1=ciDate(c); return r2(sum(S.simple.accounts,function(a){ return acctDelta(a,d0,d1); })); }
  return r2(c.balance-p.balance+(+c.saved||0));

function ciCourant(c){ if(!c.snap) return c.balance; var d=ciDate(c); return r2(sum(S.simple.accounts.filter(function(a){return a.type==='courant'}),function(a){ var b=balAt(a,d); return b||0; })); }
function startKey(){
  var ks=S.simple.checkins.map(function(c){return c.month}).sort();
  var st=S.settings.started||null;
  if(ks.length&&(!st||ks[0]<st)) st=ks[0];
  return st||curKey();
}
function lateMonths(){
  if(S.example) return [];

  return out;
}

    if(!active()){ stop(true); return; }
    var sheetOpen=!document.getElementById('sheet').hidden;
    root.hidden=sheetOpen; if(sheetOpen) return;
    var st=STEPS[S.settings.tour], ok=!st.done||st.done(), sig=S.settings.tour+':'+ok+':'+(typeof st.text==='function'?st.text():'')+(typeof st.title==='function'?st.title():'');
    if(sig!==lastSig){ lastSig=sig; bub.innerHTML=content(st); if(shown!==S.settings.tour){ shown=S.settings.tour; bub.classList.remove('in'); void bub.offsetWidth; bub.classList.add('in'); } }
    var sx=scrollX, sy=scrollY, W=document.documentElement.clientWidth, D=Math.max(document.documentElement.scrollHeight,innerHeight);
    root.style.height=D+'px';
    var t=st.target&&document.querySelector(st.target), r=null;
    document.body.classList.toggle('tour-head',!(t&&t.closest('.top')));
    if(t&&t.offsetParent!==null){ var bb=t.getBoundingClientRect(), pad=8; r={l:Math.max(4,bb.left+sx-pad),t:Math.max(0,bb.top+sy-pad),r:Math.min(W-4,bb.right+sx+pad),b:bb.bottom+sy+pad}; if(r.b<=r.t) r=null; }
    if(r){
      hole.hidden=false; hole.style.cssText='left:'+r.l+'px;top:'+r.t+'px;width:'+(r.r-r.l)+'px;height:'+(r.b-r.t)+'px';
      blk[0].style.cssText='left:0;top:0;right:0;height:'+r.t+'px';
      blk[1].style.cssText='left:0;top:'+r.b+'px;right:0;height:'+Math.max(0,D-r.b)+'px';
      blk[2].style.cssText='left:0;top:'+r.t+'px;width:'+r.l+'px;height:'+(r.b-r.t)+'px';
      blk[3].style.cssText='left:'+r.r+'px;top:'+r.t+'px;right:0;height:'+(r.b-r.t)+'px';
      bub.classList.remove('center');
    } else {
      hole.hidden=true; blk[0].style.cssText='left:0;top:0;right:0;height:'+D+'px'; blk[1].style.cssText=blk[2].style.cssText=blk[3].style.cssText='display:none';
      bub.classList.add('center');
    }
  }
  return {active:active,start:start,show:show,stop:stop,fresh:fresh};
})();

/* ---------- Feuilles ---------- */
var sheetTimer;
function openSheet(title,html,mount){
  clearTimeout(sheetTimer);
  $('#sheet-title').textContent=title; $('#sheet-body').innerHTML=html;
  var sh=$('#sheet'),sc=$('#scrim'); sh.hidden=false; sc.hidden=false; sh.scrollTop=0;
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ sh.classList.add('open'); sc.classList.add('open'); }); });
  if(mount) mount($('#sheet-body'));
  FX.sheetEnter($('#sheet-body'));
}
function closeSheet(){
  var sh=$('#sheet'),sc=$('#scrim'); sh.classList.remove('open'); sc.classList.remove('open');
  sheetTimer=setTimeout(function(){ sh.hidden=true; sc.hidden=true; $('#sheet-body').innerHTML=''; },230);
}
function confirmSheet(title,text,ok,onOk,danger){
  openSheet(title,'<div class="form"><p style="margin:0">'+text+'</p><div class="actions"><button class="btn '+(danger?'danger':'primary')+' block" id="cf-ok">'+esc(ok)+'</button><button class="btn block" id="cf-no">Annuler</button></div></div>',function(){
    $('#cf-ok').onclick=function(){ closeSheet(); onOk(); };
    $('#cf-no').onclick=closeSheet;
  });
}
var toastTimer;
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.hidden=false; t.style.animation='none'; void t.offsetWidth; t.style.animation=''; clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.hidden=true},2400); }
function seg(name,opts,val){ return '<div class="seg" role="group" data-seg="'+name+'">'+opts.map(function(o){return '<button type="button" data-v="'+o[0]+'" aria-pressed="'+(o[0]===val)+'">'+o[1]+'</button>'}).join('')+'</div>'; }
function bindSeg(root,name,cb){ var g=root.querySelector('[data-seg="'+name+'"]'); g.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; g.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))}); cb(b.dataset.v); }); }
function amountStr(n){ return n==null||isNaN(n)?'':String(r2(n)).replace('.',','); }

function daysSince(ds){ return Math.floor((parseISO(iso(today))-parseISO(ds))/864e5); }
function backupLabel(){ var l=S.settings.lastBackup; if(!l) return 'jamais'; var d=daysSince(l); return d<=0?'aujourd’hui':d===1?'hier':'il y a '+d+' jours ('+shortDate(l)+')'; }
function backupDue(){
  if(S.example||S.settings.remind===false) return false;
  if(S.settings.snooze&&S.settings.snooze>iso(today)) return false;
  var l=S.settings.lastBackup, hasData=S.simple.checkins.length>0||setupMissing().length<4;
  if(!hasData) return false;
  if(!l) return S.simple.checkins.length>0||(S.settings.started&&S.settings.started<curKey());
  return daysSince(l)>=30;
}
function markBackup(){ S.settings.lastBackup=iso(today); S.settings.snooze=null; save(); var r=$('#s-last'); if(r) r.textContent=backupLabel(); render(); }
function backupNudge(){
  if(S.example||S.settings.remind===false) return;
  var l=S.settings.lastBackup; if(l&&daysSince(l)<7) return;
  setTimeout(function(){ if(!$('#sheet').hidden) return;
    confirmSheet('Sauvegarder ton bilan ?','Tes données ne sont que sur ce téléphone. Une sauvegarde rangée sur Drive ou envoyée par mail te protège si tu changes de téléphone. Dernière sauvegarde : '+backupLabel()+'.','Sauvegarder maintenant',exportFile); },1900);
}
function settingsForm(){
  var html='<form class="form" id="sf" novalidate>'
    +'<div class="row2"><div class="field"><label for="s-name">Ton prénom</label><input id="s-name" maxlength="24" value="'+esc(S.settings.name)+'" placeholder="Facultatif"></div>'
    +'<div class="field"><label for="s-m">Marge « à mettre de côté » (%)</label><input id="s-m" inputmode="numeric" value="'+esc(S.settings.margin)+'"></div></div>'
    +'<button class="btn primary block" type="submit">Enregistrer</button></form>'
    +'<div class="group" style="margin-top:16px"><h3>Sauvegarde</h3><p class="help">Tes données restent uniquement sur ce téléphone. Fais une sauvegarde de temps en temps et range-la sur ton Drive ou envoie-la-toi par mail.</p>'
    +'<p class="help">Dernière sauvegarde : <b id="s-last">'+backupLabel()+'</b></p>'
    +'<label class="switch" for="s-remind"><span><b>Me rappeler de sauvegarder</b><br><span class="small muted">Après chaque bilan, et si la dernière sauvegarde a plus d’un mois.</span></span><input type="checkbox" id="s-remind" role="switch"'+(S.settings.remind!==false?' checked':'')+'><i aria-hidden="true"></i></label>'
    +'<button class="btn block" id="s-dl">Exporter une sauvegarde</button><button class="btn block" id="s-copy">Copier les données</button>'
    +'<div class="field"><label for="s-file">Restaurer depuis un fichier</label><input id="s-file" type="file" accept=".json,application/json"></div>'
    +'<div class="field"><label for="s-paste">…ou coller une sauvegarde</label><textarea id="s-paste" placeholder="{&quot;v&quot;:1, …}"></textarea></div>'
    +'<button class="btn block" id="s-imp">Restaurer le texte collé</button><p class="err" id="s-err" hidden></p></div>'
    +'<div class="group" style="margin-top:16px"><h3>Affichage</h3>'
    +'<label class="switch" for="s-lite"><span><b>Animations légères</b><br><span class="small muted">Pour les téléphones plus anciens : coupe le flou, le fond animé et l’inclinaison de la carte. Réglage propre à ce téléphone.</span></span><input type="checkbox" id="s-lite" role="switch"'+(FX.isLite()?' checked':'')+'><i aria-hidden="true"></i></label></div>'
    +'<div class="group" style="margin-top:16px"><h3>Installer sur l’écran d’accueil</h3><p class="help"><b>Android</b> (Chrome) : menu ⋮ → <i>Installer l’application</i>.<br><b>iPhone</b> (Safari) : bouton Partager → <i>Sur l’écran d’accueil</i>.</p></div>'
    +'<div class="group" style="margin-top:16px"><h3>Guide de démarrage</h3><p class="help">Le guide reprend chaque étape avec ce que tu as déjà saisi. Rien n’est effacé.</p><button class="btn block" id="s-tour">Relancer le guide de démarrage</button></div><div class="group" style="margin-top:16px"><h3>Recommencer</h3><button class="btn block" id="s-ex">Revoir les données d’exemple</button><button class="btn danger block" id="s-reset">Tout effacer</button></div>';
  openSheet('Réglages',html,function(){
    $('#sf').addEventListener('submit',function(e){ e.preventDefault(); var m=num($('#s-m').value); S.settings.name=$('#s-name').value.trim(); S.settings.margin=isNaN(m)?10:Math.max(0,Math.min(90,m)); save(); closeSheet(); render(); toast('Réglages enregistrés'); });
    $('#s-dl').onclick=exportFile;
    $('#s-remind').addEventListener('change',function(e){ S.settings.remind=e.target.checked; save(); render(); toast(e.target.checked?'Rappels activés':'Rappels désactivés'); });
    $('#s-lite').addEventListener('change',function(e){ FX.setLite(e.target.checked); render(); toast(e.target.checked?'Animations légères activées':'Animations complètes'); });
    $('#s-tour').onclick=function(){ closeSheet(); setTimeout(Tour.start,260); };
    $('#s-copy').onclick=function(){ var txt=JSON.stringify(S); var fb=function(){ var t=$('#s-paste'); t.value=txt; t.focus(); t.select(); toast('Texte sélectionné : copie-le'); };
      try{ navigator.clipboard.writeText(txt).then(function(){ markBackup(); toast('Données copiées : colle-les dans une note ou un mail'); },fb); }catch(e){ fb(); } };
    $('#s-file').addEventListener('change',function(e){ var f=e.target.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ importText(r.result); }; r.readAsText(f); });
    $('#s-imp').onclick=function(){ importText($('#s-paste').value); };
    $('#s-ex').onclick=function(){ confirmSheet('Revoir l’exemple ?','Tes données actuelles seront remplacées par les données d’exemple. Exporte une sauvegarde avant si besoin.','Afficher l’exemple',function(){ S=exampleData(); tab='s-home'; save(); render(); },true); };
    $('#s-reset').onclick=function(){ confirmSheet('Tout effacer ?','Toutes les données de ce téléphone (budget, bilans, comptes) seront supprimées. Cette action est définitive.','Tout effacer',function(){ Tour.fresh(); toast('Données effacées'); },true); };
  });
}
function exportFile(){
  var txt=JSON.stringify(S,null,1), name='carnet-sauvegarde-'+iso(new Date())+'.json';
  try{
    var file=new File([txt],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ navigator.share({files:[file],title:'Sauvegarde Carnet de Comptes'}).then(function(){ markBackup(); toast('Sauvegarde enregistrée'); }).catch(function(){}); return; }
  }catch(e){}
  try{ var url=URL.createObjectURL(new Blob([txt],{type:'application/json'})); var a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(url)},2000); markBackup(); toast('Fichier de sauvegarde créé'); }
  catch(e){ toast('Export impossible ici : utilise « Copier les données »'); }
}
function importText(txt){
  var err=$('#s-err');
  try{ var d=JSON.parse(txt); if(!valid(d)) throw 0; d=normalize(d); d.example=false;
    confirmSheet('Restaurer cette sauvegarde ?',d.simple.checkins.length+' bilans, '+d.simple.accounts.length+' comptes. Les données actuelles seront remplacées.','Restaurer',function(){ S=d; save(); render(); toast('Sauvegarde restaurée'); },true);
  }catch(e){ if(err){ err.textContent='Ce n’est pas une sauvegarde Carnet de Comptes valide.'; err.hidden=false; } }
}


var TABS=['s-home','s-budget','s-wealth','s-hist'];
function render(){
  $('#brand-name').textContent=S.settings.name?'Les comptes de '+S.settings.name:'Carnet de Comptes';
  TABS.forEach(function(k){ $('#v-'+k).hidden=k!==tab; });
  document.querySelectorAll('.tab').forEach(function(b){ if(b.dataset.tab===tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  document.querySelector('.tabs .wrap').style.setProperty('--idx',TABS.indexOf(tab));
  $('#month-bar').hidden=!(tab==='s-home'||tab==='s-budget');
  var mp=vm.split('-').map(Number), cur=curKey();
  $('#m-label').innerHTML='<span>'+monthLabel(mp[0],mp[1]-1)+'</span>'+(vm!==cur?'<small>Revenir à '+mName(cur)+'</small>':'<small class="now">Ce mois-ci</small>');
  $('#m-next').disabled=vm>=shiftKey(cur,12);
  ({'s-home':renderSHome,'s-budget':renderSBudget,'s-wealth':renderSWealth,'s-hist':renderSHist})[tab]();
  FX.hydrate($('#v-'+tab));
}
function setMonth(k){ if(k===vm) return; var fwd=k>vm; FX.navigate(fwd?0:1,fwd?1:0,function(){ vm=k; render(); }); }
function go(t){ if(t===tab){ window.scrollTo({top:0,behavior:FX.reduced()?'auto':'smooth'}); return; } FX.navigate(TABS.indexOf(tab),TABS.indexOf(t),function(){ tab=t; render(); window.scrollTo(0,0); }); }

/* ---------- Événements ---------- */
document.querySelector('.tabs').addEventListener('click',function(e){ var b=e.target.closest('[data-tab]'); if(b) go(b.dataset.tab); });
$('#btn-settings').onclick=settingsForm;
$('#m-prev').onclick=function(){ setMonth(shiftKey(vm,-1)); };
$('#m-next').onclick=function(){ if(vm<shiftKey(curKey(),12)) setMonth(shiftKey(vm,1)); };
$('#m-label').onclick=function(){ setMonth(curKey()); };
$('#sheet-close').onclick=closeSheet; $('#scrim').onclick=closeSheet;
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!$('#sheet').hidden) closeSheet(); });
$('main').addEventListener('click',function(e){
  var el;
  if((el=e.target.closest('[data-swact]'))){ var sw=el.closest('.sw'); FX.closeSwipes(); swipeAct(sw.dataset.sw,sw.dataset.id,el.dataset.swact); return; }
  if((el=e.target.closest('[data-line]'))){ var p=el.dataset.line.split(':'), pl=planFor(vm); var it=pl[p[0]]&&pl[p[0]].find(function(x){return x.id===p[1]}); if(it) lineForm(p[0],it); }
  else if((el=e.target.closest('[data-extra]'))){ var ex=S.simple.extras.find(function(x){return x.id===el.dataset.extra}); if(ex) extraForm(ex); }
  else if((el=e.target.closest('[data-addextra]'))) extraForm(null);
  else if((el=e.target.closest('[data-addline]'))) lineForm(el.dataset.addline,null);
  else if((el=e.target.closest('[data-ci]'))){ var c=ciFind(el.dataset.ci); if(c) ciForm(c); }
  else if((el=e.target.closest('[data-addci]'))) ciForm(null,el.dataset.addci||null);
  else if((el=e.target.closest('[data-acct]'))){ var a=S.simple.accounts.find(function(x){return x.id===el.dataset.acct}); if(a) accForm(a); }
  else if((el=e.target.closest('[data-addacct]'))) accForm(null);
  else if((el=e.target.closest('[data-loan]'))){ var lo=S.simple.loans.find(function(x){return x.id===el.dataset.loan}); if(lo) loanForm(lo); }
  else if((el=e.target.closest('[data-addloan]'))) loanForm(null);
  else if((el=e.target.closest('[data-tour-restart]'))) Tour.start();
  else if((el=e.target.closest('[data-backup]'))) exportFile();
  else if((el=e.target.closest('[data-backup-later]'))){ var d=new Date(today); d.setDate(d.getDate()+7); S.settings.snooze=iso(d); save(); render(); toast('Rappel dans une semaine'); }
  else if((el=e.target.closest('[data-goto]'))) go(el.dataset.goto);
});
render();
FX.mesh(); FX.splash(); FX.sheetInit(closeSheet);
if(Tour.active()) setTimeout(Tour.show,FX.reduced()?0:1000);
FX.tabSwipe($('main'),function(){return TABS.indexOf(tab);},TABS.length,function(i){ go(TABS[i]); });
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
})();
</script>
